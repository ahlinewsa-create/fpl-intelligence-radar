[project]
name = "tal3d-global-hunter"
version = "0.1.0"
description = "Evidence-first, object-level STL opportunity hunter"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
