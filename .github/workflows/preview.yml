name: TaL3D - Preview Improved Intelligence Report
on:
  push:
    branches: [main]
    paths:
      - "config/preview-trigger.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tal3d-state-main
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install -e ".[test]" > /tmp/tal3d-install.log 2>&1 || { tail -n 35 /tmp/tal3d-install.log; exit 1; }
          python -m pytest -q > /tmp/tal3d-tests.log 2>&1 || { cat /tmp/tal3d-tests.log; exit 1; }
          HUNTER_REPORT_MODE=manual python -m pytest -q >> /tmp/tal3d-tests.log 2>&1 || { cat /tmp/tal3d-tests.log; exit 1; }
          cat /tmp/tal3d-tests.log
      - name: Collect and re-analyze older news
        id: collect
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          CULTS_USERNAME: ${{ secrets.CULTS_USERNAME }}
          CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
        run: python main.py collect
      - name: Create preview without email
        id: preview
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          HUNTER_NOTIFICATIONS_ENABLED: "0"
        run: python main.py dry-run
      - name: Write diagnostic status (no secrets)
        if: always()
        run: |
          mkdir -p data
          printf 'tests=%s\ncollect=%s\npreview=%s\n' \
            '${{ steps.tests.outcome }}' \
            '${{ steps.collect.outcome }}' \
            '${{ steps.preview.outcome }}' > data/preview_status.txt
          if [ -f /tmp/tal3d-tests.log ]; then
            echo '--- pytest diagnosis (nonsecret offline tests) ---' >> data/preview_status.txt
            tail -n 42 /tmp/tal3d-tests.log >> data/preview_status.txt
          elif [ -f /tmp/tal3d-install.log ]; then
            echo '--- installer diagnosis ---' >> data/preview_status.txt
            tail -n 16 /tmp/tal3d-install.log >> data/preview_status.txt
          fi
      - name: Commit evidence and preview status
        if: always()
        run: |
          git config user.name "tal3d-hunter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/preview_status.txt
          if [ -f reports/preview.html ]; then git add -f reports/preview.html; fi
          if ! git diff --cached --quiet; then
            git commit -m "hunter: update preview evidence and diagnostic status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Store backup preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tal3d-preview-${{ github.run_id }}
          path: |
            reports/preview.html
            data/state.json
            data/preview_status.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Enforce green only when review succeeds
        if: always()
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.collect.outcome }}' = success
          test '${{ steps.preview.outcome }}' = success
