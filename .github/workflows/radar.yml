name: FPL Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check sources
        run: python -m fpl_radar.cli --check-sources
      - name: Build report
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: |
          if [ -n "$FPL_TEAM_ID" ]; then
            python -m fpl_radar.cli --team-id "$FPL_TEAM_ID"
          else
            python -m fpl_radar.cli
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-report
          path: reports/latest.json
          retention-days: 14
